<!DOCTYPE html>
<html>

<head>
    <title>My planet cards</title>
    <style>
        body{
            font-family: Arial;
            background-color: #f0f4ff;
            padding: 30px
            text-align: center;
        }
        h1 { color: #ff5a43; }
        p { color: #555; }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        .card {
            background-color: #fff;
            border-radius: 12px;
            border: 3px solid #ff5a43;
            padding: 20px;
            width: 200px;
        }
        .planet-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .planet-fact {
            color: #666;
            font-size: 14px;
            margin-top: 10px; }
    button {
        background-color: #ff5a43;
        color: white;
        border: none;
        padding: 12px 28px;
        margin-top: 10px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <h1>My Planet Cards</h1>
    <p>Use a Javascript class to build planet cards!</p>
    <button onclick="showPlanets()">Show Planets</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class Planet {
            constructor(name, fact) {
                this.name = name;
                this.fact0 = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
            }
        
            function showPlanets() {
                const planet1 = new Planet("Mercury", "Mercury is the closest planet to the Sun.");
                const planet2 = new Planet("Venus", "Venus is the hottest planet in our solar system.");
                const planet3 = new Planet("Earth", "Earth is the only planet known to support life.");

                document.getElementById("card1").innerHTML = "<div class='card'><div class='planet-name'>" + planet1.name + "</div><div class='planet-fact'>" + planet1.fact + "</div></div>";
                document.getElementById("card2").innerHTML = "<div class='card'><div class='planet-name'>" + planet2.name + "</div><div class='planet-fact'>" + planet2.fact + "</div></div>";
                document.getElementById("card3").innerHTML = "<div class='card'><div class='planet-name'>" + planet3.name + "</div><div class='planet-fact'>" + planet3.fact + "</div></div>";
            }
    </script>
            
</body>
</html>
